<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Subway Surfers Webpage</title>
  <style>
    body {
      margin: 0;
      font-family: 'Comic Sans MS', cursive;
      background-color: aquamarine;
      background-image: url(https://m.media-amazon.com/images/M/MV5BNWRkNGNmMDgtMmU5MC00MjgzLWFmZTQtNTdhZDYzMGUzN2I0XkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg);
       background-size: 1400px   600px;
       background-repeat: no-repeat;
       background-position:  top;
      overflow-x: hidden;
    }

    .text {
  position: absolute;
  bottom: 60px; 
  left: 30px;   
  color: rgb(3, 42, 78);
 
}
    

.bottom-nav {
  position: fixed;
  bottom: 0;
  width: 100%;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  padding: 8px;
  background: #0007;
}

button {
  background: rgb(50, 3, 170);
  border: 0;
  border-radius: 5px;
  padding: 10px;
  color: #fff;
}
    
  </style>
</head>
<body>
  <div class="text">
   
    <h1>Run, Dodge, and Surf the Subway!
    Join Jake and friends in the endless running adventure.</h1>
  </div>

<div class="bottom-nav">
  <button class="nav-btn">Play</button>
  <button class="nav-btn">Shop</button>
  <button class="nav-btn">Awards</button>
  <button class="nav-btn">Characters</button>
</div>

</body>
</html>
